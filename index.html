<!DOCTYPE html>
<html>
<head>
    <title>DevOps CI/CD Pipeline</title>
 
    <style>
 
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
 
        .container{
            text-align:center;
            background: rgba(255,255,255,0.1);
            padding:50px;
            border-radius:20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }
 
        h1{
            font-size:48px;
            margin-bottom:20px;
            color:#00ffcc;
        }
 
        h2{
            font-size:28px;
            color:#ffffff;
        }
 
        p{
            margin-top:20px;
            font-size:18px;
            color:#dcdcdc;
        }
 
        .highlight{
            color:#ffcc00;
            font-weight:bold;
        }
 
    </style>
 
</head>
 
<body>
 
    <div class="container">
 
        <h1>🚀 CI/CD Pipeline Success</h1>
 
        <h2>
            GitHub ➜ Jenkins ➜ Docker ➜ AWS
        </h2>
 
        <p>
            Automated deployment using 
            <span class="highlight">Jenkins Pipeline</span>
        </p>
 
    </div>
 
</body>
</html>
